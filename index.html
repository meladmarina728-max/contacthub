
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-address-book"></i></div>
        <div>
          <h1 class="brand-name">Contact<span>Hub</span></h1>
          <p class="brand-sub">Smart Contact Manager</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-primary" id="openModalBtn"><i class="fa-solid fa-plus"></i> Add Contact</button>
        <button class="icon-btn" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
        <button class="icon-btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
        <div class="user-avatar"><img src="avatar.jpg" alt="Profile"></div>
      </div>
    </header>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-icon total"><i class="fa-solid fa-user-group"></i></div>
        <div>
          <span class="stat-label">Total</span>
          <strong class="stat-value" id="totalCount">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon fav"><i class="fa-solid fa-star"></i></div>
        <div>
          <span class="stat-label">Favorites</span>
          <strong class="stat-value" id="favCount">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon emg"><i class="fa-solid fa-heart-pulse"></i></div>
        <div>
          <span class="stat-label">Emergency</span>
          <strong class="stat-value" id="emgCount">0</strong>
        </div>
      </div>
    </section>

    <main class="layout">
      <section class="contacts-section">
        <h2 class="section-title">All Contacts</h2>
        <p class="section-sub">Manage and organize your <span id="subCount">0</span> contacts</p>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search by name, phone, or email...">
        </div>
        <div class="contacts-list" id="contactsList"></div>
      </section>

      <aside class="side">
        <div class="side-card fav-card">
          <div class="side-head">
            <div class="side-icon fav"><i class="fa-solid fa-star"></i></div>
            <div>
              <h3>Favorites</h3>
              <p>Quick access</p>
            </div>
          </div>
          <div class="side-body" id="favList"></div>
        </div>
        <div class="side-card emg-card">
          <div class="side-head">
            <div class="side-icon emg"><i class="fa-solid fa-heart-pulse"></i></div>
            <div>
              <h3>Emergency</h3>
              <p>Urgent contacts</p>
            </div>
          </div>
          <div class="side-body" id="emgList"></div>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Add New Contact</h2>
        <button class="close-btn" id="closeModalBtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="contactForm" novalidate>
        <div class="photo-box">
          <div class="photo-circle" id="photoPreview"><i class="fa-solid fa-user"></i></div>
          <label class="photo-btn" for="photoInput"><i class="fa-solid fa-camera"></i> Change Photo</label>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>

        <div class="field">
          <label for="nameInput">Full Name <span class="req">*</span></label>
          <input type="text" id="nameInput" placeholder="Enter full name">
          <small class="error-text" id="nameError"></small>
        </div>

        <div class="field">
          <label for="phoneInput">Phone Number <span class="req">*</span></label>
          <input type="tel" id="phoneInput" placeholder="e.g., 01012345678">
          <small class="error-text" id="phoneError"></small>
        </div>

        <div class="field">
          <label for="emailInput">Email Address</label>
          <input type="email" id="emailInput" placeholder="name@example.com">
          <small class="error-text" id="emailError"></small>
        </div>

        <div class="field">
          <label for="addressInput">Address</label>
          <input type="text" id="addressInput" placeholder="Enter address">
        </div>

        <div class="field">
          <label for="groupInput">Group</label>
          <select id="groupInput">
            <option value="Family">Family</option>
            <option value="Friends">Friends</option>
            <option value="Work">Work</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="checks">
          <label class="check">
            <input type="checkbox" id="favInput">
            <span class="check-box fav"><i class="fa-solid fa-star"></i> Add to Favorites</span>
          </label>
          <label class="check">
            <input type="checkbox" id="emgInput">
            <span class="check-box emg"><i class="fa-solid fa-heart-pulse"></i> Emergency Contact</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="submitBtn">Save Contact</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js"></script>
</body>
</html>
